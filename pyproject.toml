[project]
name = "lqr-vs-rl-landing"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = ["--strict-markers", "--tb=short", "-v"]

[tool.run-script]
lint = "uv run ruff check ."
fmt = "uv run ruff format ."
check = ["lint", "fmt"]
test = "uv run pytest"
all = ["check", "test"]
